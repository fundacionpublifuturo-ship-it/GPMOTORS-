<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro equipo · GPMOTORS</title>
<meta name="description" content="El equipo de GPMOTORS en Ibagué: ventas, marketing, administración y servicio de apartacoches.">
<link rel="canonical" href="https://gpmotors.com.co/equipo">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#d71920;--black:#171717;--white:#ffffff;--paper:#f7f7f4;--ink:#1d1d1d;--muted:#6f6f6a;--line:#dcdcd6;--title:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--display:'Barlow Condensed','Arial Narrow',Impact,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--white);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}

/* barra superior: blanca, como Romans, con el logo GP */
.topbar{background:var(--white);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:10}
.topbar-inner{max-width:1280px;margin:0 auto;padding:14px clamp(20px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px}
.topbar img{height:44px;width:auto;display:block}
.back{font-family:var(--title);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:10px}
.back:hover{color:var(--red)}

/* título centrado, espaciado amplio, con regla negra */
.intro{text-align:center;padding:clamp(56px,8vw,104px) 20px clamp(40px,5vw,64px)}
.intro h1{font-family:var(--title);font-weight:500;font-size:clamp(26px,4.2vw,48px);letter-spacing:.32em;text-transform:uppercase;margin:0 0 26px;padding-left:.32em}
.intro .rule{width:120px;height:2px;background:var(--ink);margin:0 auto}
.intro .kicker{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin:0 0 20px}

/* cuerpo: columna lateral + grilla de fotos */
.body{max-width:1100px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(72px,9vw,120px)}
.stack{display:flex;flex-direction:column;gap:clamp(56px,7vw,96px)}
.side{text-align:center;padding:24px 16px;border-right:1px solid var(--line);align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:18px}
.side h2{font-family:var(--title);font-weight:500;font-size:20px;letter-spacing:.28em;text-transform:uppercase;margin:0;padding-left:.28em}
.side p{font-size:15px;line-height:1.7;color:var(--muted);margin:0}

.card{display:grid;grid-template-columns:minmax(260px,42%) 1fr;gap:clamp(28px,4vw,56px);align-items:center;border-top:1px solid var(--line);padding-top:clamp(40px,5vw,56px)}
.card:first-child{border-top:0;padding-top:0}
.photo{position:relative;width:100%;aspect-ratio:4/5;background:var(--black);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.card:hover .photo img{transform:scale(1.03)}
.photo.empty{display:flex;align-items:flex-end;justify-content:flex-start;padding:22px;background:linear-gradient(160deg,#2a2a2a 0%,#121212 70%)}
.photo.empty::before{content:"";position:absolute;left:22px;top:22px;width:28px;height:2px;background:var(--red)}
.photo.empty span{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8d8d86}
.caption{padding-top:0}
.desc{font-size:16px;line-height:1.7;color:var(--muted);margin:18px 0 0;max-width:440px}
.name{font-family:var(--title);font-size:24px;font-weight:600;margin:0 0 6px;letter-spacing:.01em}
.role{font-family:var(--sans);font-size:15px;color:var(--muted);margin:0}
.wa-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.wa{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:3px}
.wa:hover{color:var(--red);border-color:var(--red)}

/* cierre */
.closing{background:var(--black);color:var(--white);text-align:center;padding:clamp(56px,7vw,88px) 20px}
.closing h2{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.5vw,52px);line-height:1.05;margin:0 0 28px;text-transform:uppercase}
.closing h2 span{color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:18px;padding:16px 26px;font-family:var(--title);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;background:var(--red);color:var(--white);min-height:52px;transition:background .2s}
.btn:hover{background:var(--white);color:var(--black)}
.foot{background:var(--black);color:#8a8a84;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:0 0 28px;text-align:center;border-top:1px solid #2a2a2a;padding-top:22px}

@media (max-width:760px){
  .card{grid-template-columns:1fr;gap:24px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" aria-label="GPMOTORS, volver al inicio"><img src="assets/media/64e37fc9a10f0707ab2b.png" alt="GP Motors" width="446" height="448"></a>
    <a class="back" href="/">← Volver a GPMOTORS</a>
  </div>
</header>

<section class="intro">
  <p class="kicker">02 / La experiencia GPMOTORS</p>
  <h1>Nuestro equipo</h1>
  <div class="rule" aria-hidden="true"></div>
</section>

<main class="body">
  <div class="stack" id="team-grid"></div>
</main>

<section class="closing">
  <h2>Tu próximo nivel<br>está a <span>una conversación.</span></h2>
  <a class="btn" href="https://wa.me/573104478680?text=Hola%20GPMOTORS%2C%20quiero%20hablar%20con%20un%20asesor." target="_blank" rel="noopener noreferrer">Habla con un asesor →</a>
</section>

<footer class="foot">
  GPMOTORS · Carrera 6 #31-14, San Simón parte alta, Ibagué · Lunes a sábado 8:00 a. m. – 6:00 p. m.
</footer>

<script>
/*
  EDITA AQUÍ EL EQUIPO.
  role:     cargo debajo del nombre
  name:     nombre de la persona (vacío = muestra el cargo como título)
  photo:    ruta de la foto, ej. "assets/equipo/nombre.webp" (vacío = bloque negro "Foto pendiente")
  contacts: [{ label, phone }] phone = 57 + 10 dígitos. Vacío = sin botones de WhatsApp.
*/
const TEAM = [
  { role: 'Gerencia', name: 'Fabricio Ramírez', photo: 'assets/equipo/gerencia.jpg', desc: 'Dirige GPMOTORS y responde por cada negociación, desde la compra hasta la entrega.', contacts: [
      { label: 'Gerencia', phone: '573104478680' }
  ]},
  { role: 'Administración', name: 'Agie', photo: 'assets/equipo/administracion.jpg', desc: 'Documentación, inventario y trámites de cada vehículo, para que todo quede en orden desde el primer día.', contacts: [] },
  { role: 'Marketing', name: 'Diego Zuñiga', photo: 'assets/equipo/marketing.jpg', desc: 'Contenido, campañas y comunicación de la marca, para que cada vehículo llegue a quien lo está buscando.', contacts: [] },
  { role: 'Equipo de ventas', name: '', photo: '', desc: 'Asesoría personalizada para compra, venta y recepción en parte de pago. Te acompañamos hasta la entrega.', contacts: [
      { label: 'Asesor 1', phone: '573104478680' },
      { label: 'Asesor 2', phone: '573102226068' },
      { label: 'Asesor 3', phone: '573229000063' }
  ]},
  { role: 'Servicio de apartacoches', name: '', photo: '', desc: 'Recepción, cuidado y entrega de los vehículos en el local, con la misma atención en cada visita.', contacts: [] }
];

const MSG = encodeURIComponent('Hola GPMOTORS, quiero información sobre sus vehículos.');
const grid = document.getElementById('team-grid');

TEAM.forEach(m => {
  const card = document.createElement('article');
  card.className = 'card';

  const photo = document.createElement('div');
  if (m.photo) {
    photo.className = 'photo';
    const img = document.createElement('img');
    img.src = m.photo;
    img.alt = (m.name ? m.name + ' · ' : '') + m.role;
    img.loading = 'lazy';
    photo.appendChild(img);
  } else {
    photo.className = 'photo empty';
    const label = document.createElement('span');
    label.textContent = 'Foto pendiente';
    photo.appendChild(label);
  }

  const caption = document.createElement('div');
  caption.className = 'caption';

  const name = document.createElement('p');
  name.className = 'name';
  name.textContent = m.name || m.role;

  caption.appendChild(name);

  if (m.desc) {
    const desc = document.createElement('p');
    desc.className = 'desc';
    desc.textContent = m.desc;
    caption.appendChild(desc);
  }

  if (m.name) {
    const role = document.createElement('p');
    role.className = 'role';
    role.textContent = m.role;
    caption.appendChild(role);
  }

  if (m.contacts && m.contacts.length) {
    const list = document.createElement('div');
    list.className = 'wa-list';
    m.contacts.forEach(c => {
      const a = document.createElement('a');
      a.className = 'wa';
      a.href = 'https://wa.me/' + c.phone + '?text=' + MSG;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = 'WhatsApp · ' + c.label;
      list.appendChild(a);
    });
    caption.appendChild(list);
  }

  card.append(photo, caption);
  grid.appendChild(card);
});
</script>
</body>
</html>
